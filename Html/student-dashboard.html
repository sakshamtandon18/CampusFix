<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="dashboard">

        <div class="menu">
            <h2>CampusFix</h2>

            <a href="student-dashboard.html">Dashboard</a>
            <a href="submit-complaint.html">Submit Complaint</a>
            <a href="my-complaints.html">My Complaints</a>

            <button id="logoutButton">Logout</button>
        </div>

        <div class="content">
            <h1>Student Dashboard</h1>
            <p id="welcomeText"></p>

            <div class="cards">
                <div class="card">
                    <h2 id="totalCount">0</h2>
                    <p>Total Complaints</p>
                </div>

                <div class="card">
                    <h2 id="pendingCount">0</h2>
                    <p>Pending</p>
                </div>

                <div class="card">
                    <h2 id="progressCount">0</h2>
                    <p>In Progress</p>
                </div>

                <div class="card">
                    <h2 id="resolvedCount">0</h2>
                    <p>Resolved</p>
                </div>
            </div>

            <div class="message-box">
                <h2>Report a Problem</h2>
                <p>Submit a complaint for campus problems such as Wi-Fi, water, furniture, or electricity.</p>
                <a href="submit-complaint.html">Submit Complaint</a>
            </div>
        </div>

    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/student.js"></script>
</body>
</html>
