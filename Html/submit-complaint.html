<!DOCTYPE html>
<html>
<head>
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="dashboard">

        <div class="menu">
            <h2>CampusFix</h2>

            <a href="student-dashboard.html">Dashboard</a>
            <a href="submit-complaint.html">Submit Complaint</a>
            <a href="my-complaints.html">My Complaints</a>

            <button id="logoutButton">Logout</button>
        </div>

        <div class="content">
            <h1>Submit a Complaint</h1>
            <p class="page-text">Fill in the details of the campus problem.</p>

            <div class="form-area">
                <form id="complaintForm">

                    <label>Complaint Title</label>
                    <input type="text" id="title" placeholder="Example: Fan is not working" required>

                    <label>Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option>Electricity</option>
                        <option>Wi-Fi and Internet</option>
                        <option>Classroom Maintenance</option>
                        <option>Water Supply</option>
                        <option>Cleanliness</option>
                        <option>Furniture</option>
                        <option>Other</option>
                    </select>

                    <label>Location</label>
                    <input type="text" id="location" placeholder="Example: Room 204, Block A" required>

                    <label>Priority</label>
                    <select id="priority" required>
                        <option value="">Select Priority</option>
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>

                    <label>Description</label>
                    <textarea id="description" placeholder="Explain the problem clearly" required></textarea>

                    <button type="submit">Submit Complaint</button>
                </form>
            </div>
        </div>

    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/complaints.js"></script>
</body>
</html>
